[project]
name = "pawsync-desktop"
version = "0.3.0"
description = "PawSync companion for Windows and Linux"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11", "pillow-heif>=0.21", "httpx>=0.28", "keyring>=25", "cryptography>=44", "python-xlib>=0.33; sys_platform == 'linux'", "soundcard>=0.4", "psutil>=6"]
[project.scripts]
pawsync = "pawsync.app:main"
[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4", "pyinstaller>=6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["pawsync"]
[tool.pytest.ini_options]
testpaths = ["tests"]
