[project]
name = "pawsync-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "python-multipart>=0.0.20,<1",
  "pillow>=11,<13", "pillow-heif>=0.20,<2", "httpx>=0.28,<1", "redis>=5,<8",
  "sentry-sdk[fastapi]>=2,<3", "email-validator>=2,<3"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: real PostgreSQL transaction and concurrency checks"]
