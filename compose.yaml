services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pawsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawsync}
      POSTGRES_DB: pawsync
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawsync"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
volumes:
  postgres:
  redis:
